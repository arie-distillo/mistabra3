- id: miss_01
  capability: missing_hypothesis
  control: false
  domain: industrial_quality
  given_hypotheses:
  - The batch failed because the chemical catalyst had expired.
  - The batch failed because the mixing speed was set too low.
  data_points:
  - {id: d1, role: distractor, text: "The catalyst batch tracking sheet shows an expiration date of December 2027, which is far in the future."}
  - {id: d2, role: distractor, text: "The digital control console printout verified the mixer maintained a steady rate of 450 RPM throughout the cycle."}
  - {id: d3, role: cluster_member, text: "A physical inspection revealed that the main overhead clean-room ventilation intake valve was completely blocked by plastic shipping wrap."}
  - {id: d4, role: cluster_member, text: "Differential pressure gauges inside the processing clean-room registered a sudden drop below the mandatory 15 Pascal clean threshold."}
  - {id: d5, role: cluster_member, text: "Particulate sensors stationed directly above the reaction vat recorded a ten-fold spike in ambient airborne dust concentrations."}
  - {id: d6, role: cluster_member, text: "The batch quality report noted the presence of microscopic airborne cellulose fibers embedded uniformly inside the cured product."}
  - {id: d7, role: distractor, text: "Operator Martinez logged a standard pre-check clearance at the start of the morning shift."}
  - {id: d8, role: distractor, text: "The raw chemical base ingredients were stored in airtight stainless steel cylinders prior to dispensing."}
  - {id: d9, role: distractor, text: "A maintenance engineer replaced the primary hydraulic seals on the mixer drive shaft last Tuesday."}
  - {id: d10, role: distractor, text: "The facility ambient temperature controller maintained a constant 21°C throughout the production run."}
  ground_truth:
    refuting_sets: []
    missing_hypothesis: The batch failed due to environmental contamination caused by a failure or blockage in the clean-room ventilation system.
    missing_hypothesis_alternatives:
    - Contaminants entered the product because the clean-room ventilation intake was blocked.
    - Airborne dust and fiber contamination spoiled the batch due to a drop in clean-room pressure.
    cluster_members: [d3, d4, d5, d6]
