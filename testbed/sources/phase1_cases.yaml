  data_points:
  - {id: d1, role: distractor, text: "Patient 14 was assigned to Group C, which received the active formulation of experimental drug Paxilod."}
  - {id: d2, role: refuting_member, text: "Patient 14 was inadvertently given a blister pack from Batch X-9, which contained only inert sugar pills."}
  - {id: d3, role: distractor, text: "The clinic's double-blind dispensing log notes that all blister packs marked Batch X-9 were active drug formulations."}
  - {id: d4, role: refuting_member, text: "The pharmacy inventory audit discovered that the label printer had switched batches, meaning Batch X-9 was verified to be 100% placebo."}
  - {id: d5, role: distractor, text: "Patient 14 reported the onset of throbbing cranial pain exactly 45 minutes after ingestion."}
  - {id: d6, role: refuting_member, text: "A blood draw from Patient 14 at hour 2 showed zero detectable trace levels of Paxilod or its metabolic derivatives."}
  - {id: d7, role: refuting_member, text: "The clinical protocol states that Paxilod molecules bind instantly to plasma proteins and remain detectable for 72 hours."}
  - {id: d8, role: distractor, text: "Patient 14 has a documented prior medical history of chronic tension headaches and seasonal pollen allergies."}
  - {id: d9, role: distractor, text: "Nurse practitioner Davis recorded that Patient 14's vitals were entirely stable during the baseline check."}
  - {id: d10, role: distractor, text: "Concomitant medications for Patient 14 included standard daily multi-vitamins and a low-dose aspirin."}
