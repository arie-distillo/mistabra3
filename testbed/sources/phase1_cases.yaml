# Fixture corrections (2026-11-06), relative to the project's phase1_cases.yaml:
# - miss_03 d7-d9 (coffee machine, breakroom fridge, chairs) were labelled cluster_member; the case's own verification
#   note calls them the deliberately irrelevant 'coherent_but_irrelevant' decoy cluster, so they are distractors.
# - conj_04 d6+d7 (no Paxilod in the blood at hour 2; Paxilod stays detectable for 72 hours) refute the hypothesis on
#   their own: added as a second refuting set.
# Phase-1 capability cases (from the Mistabra 3 project files). Fully synthetic.
# conj_*: a stated hypothesis and data points, some of which only refute it in conjunction; *_ctrl_*: no refutation.
# miss_*: given hypotheses and a planted cluster explained by a hypothesis nobody stated; *_ctrl_*: nothing missing.
# The `verification` blocks of the source file are omitted here; they are explanations for humans, not inputs.
- id: conj_01
  capability: conjunction_refutation
  control: false
  domain: industrial_quality
  hypothesis: Batch 404 failed because the curing temperature exceeded the 200°C maximum limit.
  data_points:
  - {id: d1, role: refuting_member, text: "The main temperature sensor for Batch 404 broke at the start of the cycle and continuously reported a stuck value of 150°C."}
  - {id: d2, role: refuting_member, text: "The backup temperature sensor for Batch 404 registered a peak reading of 215°C during the curing cycle."}
  - {id: d3, role: refuting_member, text: "Standard Operating Procedure SOP-90 requires that when the main sensor fails, the automated heating elements immediately shut off as a safety override."}
  - {id: d4, role: distractor, text: "Batch 404 exhibited severe surface blistering and discoloration typical of thermal degradation."}
  - {id: d5, role: distractor, text: "Operator Vance logged into the control console at 08:00 AM to monitor Batch 404."}
  - {id: d6, role: distractor, text: "The raw polymer resin used in Batch 404 was sourced from Lot #882."}
  - {id: d7, role: distractor, text: "A routine calibration of the backup temperature sensor had been completed three days prior to Batch 404's run."}
  - {id: d8, role: distractor, text: "Cooling fans in Chamber B operated at 100% capacity throughout the entire duration of the day shift."}
  - {id: d9, role: distractor, text: "The ambient humidity inside the production facility remained stable at 45% during Batch 404 processing."}
  - {id: d10, role: distractor, text: "Batch 403 and Batch 405, processed in the same chamber, met all quality control benchmarks."}
  - {id: d11, role: distractor, text: "The heating element power logs indicate a standard current draw of 40 Amps during the first twenty minutes."}
  ground_truth: {refuting_sets: [[d1, d2, d3]], missing_hypothesis: null, missing_hypothesis_alternatives: [], cluster_members: []}
