[project]
name = "mistabra"
version = "0.1.0"
description = "Weak/strong signal detection and hypothesis management, as an embeddable Python library"
requires-python = ">=3.11"
dependencies = ["pydantic>=2", "httpx>=0.27", "rapidfuzz>=3", "numpy>=1.26", "pyyaml>=6"]

[project.optional-dependencies]
vectors = ["lancedb>=0.10"]
splink = ["splink>=4", "duckdb>=1"]
dev = ["pytest>=8"]

[project.scripts]
mistabra = "mistabra.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests/unit"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mistabra*"]

[tool.setuptools.package-data]
mistabra = ["store/schema.sql"]
