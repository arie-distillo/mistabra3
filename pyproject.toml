[project]
name = "mistabra-core"
version = "0.3.0"
description = "Mistabra Core — the reasoning layer of an analyst's co-pilot that turns intuition into reasoning (spec v3)"
requires-python = ">=3.11"
dependencies = ["pydantic>=2", "httpx>=0.27"]

[project.optional-dependencies]
testbed = ["pyyaml>=6"]
dev = ["pytest>=8", "pyyaml>=6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mistabra_core*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
